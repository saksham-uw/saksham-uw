name: Update contribution skyline

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-skyline.mjs"
      - ".github/workflows/update-skyline.yml"

permissions:
  contents: write

concurrency:
  group: skyline
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate skyline
        run: node scripts/generate-skyline.mjs
        env:
          USERNAME: ${{ github.repository_owner }}
      - name: Commit skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if git diff --staged --quiet; then
            echo "No skyline changes"
          else
            git commit -m "chore: update contribution skyline"
            git push
          fi
